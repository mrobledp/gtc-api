[project]
name = "gtc-api"
version = "0.1.0"
description = "API del sistema GTC"
requires-python = ">=3.11"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "psycopg2-binary",
    "pydantic",
]

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
httpx = "^0.27"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
